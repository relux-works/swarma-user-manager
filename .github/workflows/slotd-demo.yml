name: Slot demo lifecycle

on:
  pull_request:
  push:
    branches: [main, slotd-demo]
  workflow_dispatch:
    inputs:
      root_tests:
        description: Run root fixtures on this disposable hosted runner
        required: true
        type: boolean
        default: false
      mutant:
        description: T19 narrowing mutant to apply; the run is green only when its named test kills it
        required: false
        type: choice
        default: none
        options: [none, m1-run-bind, m2-skip-landlock, m3-no-family-filter, m5-no-syscall-archs, m8-adopt-any-second-group, m9-adopt-retire-deletes, m10-adopt-skip-residue-gate, m11-adopt-skip-second-slot, m12-adopt-skip-system-cron, m13-adopt-skip-key-ancestry, m14-adopt-system-cron-user-field-only, m15-adopt-system-cron-follow-symlink]

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Verify every T19 mutant patch applies to this head
        # Control for the mutant runs: a stale patch would fail during setup
        # and never reach its named killing test. Every patch in the
        # directory must apply cleanly to the checked-out tree.
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(cmd/swarma-slotd-demo/internal/slotd/testdata/t19-mutants/*.patch)
          test "${#patches[@]}" -gt 0
          stale=0
          for p in "${patches[@]}"; do
            if git apply --check --verbose "$p"; then
              echo "applies: $p"
            else
              echo "::error::mutant patch does not apply: $p"
              stale=1
            fi
          done
          exit "$stale"
      - name: Verify portable contract in isolated scratch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .temp
          scratch="$(mktemp -d "$(pwd -P)/.temp/slotd-ci.XXXXXXXX")"
          scratch="$(cd "$scratch" && pwd -P)"
          mkdir -p "$scratch"/{home,work,config,cache,go-build,go-mod,go-path,tmp,evidence}
          rsync -a --exclude=.git --exclude=.temp ./ "$scratch/work/"
          go_binary="$(command -v go)"
          go_root="$(cd "$(dirname "$go_binary")/.." && pwd -P)"
          echo "SLOTD_CI_EVIDENCE=$scratch/evidence" >> "$GITHUB_ENV"
          env -i PATH="$go_root/bin:/usr/bin:/bin" \
            HOME="$scratch/home" USERPROFILE="$scratch/home" \
            XDG_CONFIG_HOME="$scratch/config" XDG_CACHE_HOME="$scratch/cache" \
            GOCACHE="$scratch/go-build" GOMODCACHE="$scratch/go-mod" GOPATH="$scratch/go-path" \
            TMPDIR="$scratch/tmp" TMP="$scratch/tmp" TEMP="$scratch/tmp" \
            GOENV=off GOROOT="$go_root" GOTOOLCHAIN=local GOWORK=off GOMAXPROCS=2 \
            GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
            bash --noprofile --norc -s -- "$scratch" <<'SH'
          set -euo pipefail
          scratch="$1"
          cd "$scratch/work"
          go version | tee "$scratch/evidence/go-version.log"
          test "$(go env GOVERSION)" = go1.26.10
          go env GOROOT GOCACHE GOMODCACHE > "$scratch/evidence/go-paths.log"
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$scratch/evidence/go-paths.log"
          gofmt -l cmd/swarma-slotd-demo | tee "$scratch/evidence/gofmt.log"
          test ! -s "$scratch/evidence/gofmt.log"
          go vet ./... 2>&1 | tee "$scratch/evidence/vet.log"
          go test -json -count=1 -timeout=2m ./cmd/swarma-slotd-demo/... 2>&1 | tee "$scratch/evidence/portable-tests.jsonl"
          GOOS=linux GOARCH=amd64 go test -c \
            -o "$scratch/evidence/slotd-demo.test" ./cmd/swarma-slotd-demo/internal/slotd
          SH
      - name: Preserve evidence
        if: always() && env.SLOTD_CI_EVIDENCE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slotd-demo-portable-evidence
          path: ${{ env.SLOTD_CI_EVIDENCE }}
          retention-days: 7
  root:
    needs: portable
    # The delivery owner publishes this branch. PRs and main pushes never run
    # privileged fixtures. All actual runner markers are forwarded unchanged.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/slotd-demo') || (github.event_name == 'workflow_dispatch' && inputs.root_tests)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Verify disposable runner and required host tools
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(cat /proc/1/comm)" = systemd
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends nftables
          test -x /usr/bin/systemd-run
          test -x /usr/bin/systemctl
          test -x /usr/bin/busctl
          test -x /usr/sbin/nft
          test -x /usr/sbin/useradd
          test -x /usr/sbin/userdel
          test -x /usr/sbin/groupadd
          test -x /usr/sbin/groupdel
          test -x /usr/bin/ip
          test -x /usr/bin/find
          test -x /usr/bin/journalctl
          test -x /usr/bin/getent
      - name: Build and run isolated root fixtures
        shell: bash
        env:
          SLOTD_T19_MUTANT: ${{ inputs.mutant || 'none' }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .temp
          scratch="$(mktemp -d "$(pwd -P)/.temp/slotd-root-ci.XXXXXXXX")"
          scratch="$(cd "$scratch" && pwd -P)"
          mkdir -p "$scratch"/{home,work,config,cache,go-build,go-mod,go-path,tmp,evidence}
          rsync -a --exclude=.git --exclude=.temp ./ "$scratch/work/"
          go_binary="$(command -v go)"
          go_root="$(cd "$(dirname "$go_binary")/.." && pwd -P)"
          echo "SLOTD_ROOT_EVIDENCE=$scratch/evidence" >> "$GITHUB_ENV"
          env -i PATH="$go_root/bin:/usr/bin:/bin" \
            HOME="$scratch/home" USERPROFILE="$scratch/home" \
            XDG_CONFIG_HOME="$scratch/config" XDG_CACHE_HOME="$scratch/cache" \
            GOCACHE="$scratch/go-build" GOMODCACHE="$scratch/go-mod" GOPATH="$scratch/go-path" \
            TMPDIR="$scratch/tmp" TMP="$scratch/tmp" TEMP="$scratch/tmp" \
            GOENV=off GOROOT="$go_root" GOTOOLCHAIN=local GOWORK=off GOMAXPROCS=2 \
            GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            SLOTD_T19_MUTANT="$SLOTD_T19_MUTANT" \
            bash --noprofile --norc -s -- "$scratch" <<'SH'
          set -euo pipefail
          scratch="$1"
          cd "$scratch/work"
          go version | tee "$scratch/evidence/go-version.log"
          test "$(go env GOVERSION)" = go1.26.10
          uname -srm > "$scratch/evidence/platform.log"
          cat /sys/kernel/security/lsm > "$scratch/evidence/lsm.log"
          run_filter='^TestRoot'
          if [ "$SLOTD_T19_MUTANT" != none ]; then
            git apply --verbose "cmd/swarma-slotd-demo/internal/slotd/testdata/t19-mutants/$SLOTD_T19_MUTANT.patch" 2>&1 | tee "$scratch/evidence/mutant.log"
            case "$SLOTD_T19_MUTANT" in
              m8-*) run_filter='^TestAdoptedGroupSet$' ;;
              m9-*|m10-*) run_filter='^TestRootAdopted' ;;
              m11-*) run_filter='^TestAdoptedSecondLiveSlot$' ;;
              m12-*|m14-*|m15-*) run_filter='^TestRootAdoptedSystemCron$' ;;
              m13-*) run_filter='^TestRootAdoptedKeyAncestry$' ;;
              *) run_filter='^TestRootT19' ;;
            esac
          fi
          /usr/bin/systemctl --version > "$scratch/evidence/systemd-version.log"
          /usr/bin/busctl --version > "$scratch/evidence/busctl-version.log"
          /usr/sbin/nft --version > "$scratch/evidence/nft-version.log"
          go test -c -o "$scratch/slotd-root.test" ./cmd/swarma-slotd-demo/internal/slotd
          # The 386 build of the same test binary is the alternate-ABI payload
          # of TestRootT19AlternateABI.
          GOOS=linux GOARCH=386 go test -c -o "$scratch/slotd-root-386.test" ./cmd/swarma-slotd-demo/internal/slotd
          go build -o "$scratch/slotd-daemon" ./cmd/swarma-slotd-demo
          cd cmd/swarma-slotd-demo/internal/slotd
          sudo -n /usr/bin/env -i PATH="$PATH" \
            HOME="$HOME" USERPROFILE="$USERPROFILE" \
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_CACHE_HOME="$XDG_CACHE_HOME" \
            GOCACHE="$GOCACHE" GOMODCACHE="$GOMODCACHE" GOPATH="$GOPATH" \
            TMPDIR="$TMPDIR" TMP="$TMP" TEMP="$TEMP" \
            GOENV=off GOROOT="$GOROOT" GOTOOLCHAIN=local GOWORK=off GOMAXPROCS=2 \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            SLOTD_ROOT_TESTS=1 SLOTD_INSTALL_BINARY="$scratch/slotd-daemon" \
            SLOTD_T19_ALT_ABI_PROBE="$scratch/slotd-root-386.test" \
            "$scratch/slotd-root.test" -test.v -test.run="$run_filter" -test.timeout=30m \
            2>&1 | go tool test2json -p slotd-root | tee "$scratch/evidence/root-tests.jsonl" || status=$?
          echo "root test pipeline status ${status:-0}" | tee "$scratch/evidence/root-status.log"
          python3 - "$scratch/evidence/root-tests.jsonl" "$SLOTD_T19_MUTANT" "${status:-0}" <<'PY'
          import json, sys
          events = [json.loads(line) for line in open(sys.argv[1])]
          mutant, status = sys.argv[2], sys.argv[3]
          if mutant != "none":
              killers = {"m1-run-bind": "TestRootT19SlotConfinement/T19.4-plants", "m2-skip-landlock": "TestRootT19SlotConfinement/T19.3-abstract", "m3-no-family-filter": "TestRootT19SlotConfinement/T19.8-families", "m5-no-syscall-archs": "TestRootT19AlternateABI", "m8-adopt-any-second-group": "TestAdoptedGroupSet", "m9-adopt-retire-deletes": "TestRootAdoptedRetirement", "m10-adopt-skip-residue-gate": "TestRootAdoptedRetirement", "m11-adopt-skip-second-slot": "TestAdoptedSecondLiveSlot", "m12-adopt-skip-system-cron": "TestRootAdoptedSystemCron", "m13-adopt-skip-key-ancestry": "TestRootAdoptedKeyAncestry", "m14-adopt-system-cron-user-field-only": "TestRootAdoptedSystemCron", "m15-adopt-system-cron-follow-symlink": "TestRootAdoptedSystemCron"}
              failed = {e["Test"] for e in events if e.get("Action") == "fail" and "Test" in e}
              assert killers[mutant] in failed, ("mutant survived", mutant, sorted(failed))
              print("mutant", mutant, "killed by", killers[mutant])
              sys.exit(0)
          assert status == "0", status
          assert not any(e.get("Action") in ("skip", "fail") for e in events)
          passed = {e["Test"] for e in events if e.get("Action") == "pass" and "Test" in e}
          assert {"TestRootRecordStore", "TestRootBootstrapExclusive", "TestRootHomeDeletionRefusals", "TestRootLifecycleRestart", "TestRootEgressLayers", "TestRootServiceRestart", "TestRootGate", "TestRootNFTOwnershipCreation", "TestRootInvalidHomeStartup", "TestRootEnforcementFence", "TestRootPayloadLeaves", "TestRootInstallPackage", "TestRootInstallRefusals", "TestRootInstallUnitNamespace", "TestRootInstallConfigInventory"} <= passed
          assert {"TestRootStationDescriptorCustody", "TestRootStationDestroyPreflight", "TestRootStationMissingJournalState", "TestRootStationCreationBoundaries"} <= passed
          assert {"TestRootStationMetadataRefusals", "TestRootStationMountRefusal"} <= passed
          assert "TestRootStationCrossUIDAccess" in passed
          assert {"TestRootStationLifecycleRetention", "TestRootStationPreexecRefusal", "TestRootStationExtraWritableBind"} <= passed
          assert "TestRootStationFenceHostView" in passed
          assert {"TestRootT19SlotConfinement", "TestRootT19DetectorControl", "TestRootT19StatusSocketBound", "TestRootT19LandlockFailClosed"} <= passed
          assert {"TestRootT19AlternateABI", "TestRootT19InventoryOmission"} <= passed
          assert {"TestRootAdoptedAccountRules", "TestRootAdoptedWalletGroup", "TestRootAdoptedRetirement", "TestRootAdoptedSystemCron", "TestRootAdoptedKeyAncestry"} <= passed
          PY
          SH
      - name: Preserve root evidence
        if: always() && env.SLOTD_ROOT_EVIDENCE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slotd-demo-root-evidence
          path: ${{ env.SLOTD_ROOT_EVIDENCE }}
          retention-days: 7
