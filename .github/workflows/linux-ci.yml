# Template for public module repositories.
# Repository-specific: Go version; test flags/packages and qualification variable;
# peer-test names in the exclusion report and the exact -skip list below.
name: Linux Go CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.10' # Repository-specific toolchain pin.
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      # Repository-specific: these five fixtures require sudo-to-peer accounts.
      # They run during review on a prepared host, not in unprivileged CI.
      - name: Report privileged test exclusions
        run: |
          printf '%s\n' 'SKIP (requires sudo; review on a prepared host):' \
            TestPeerTemporaryFileInventory \
            TestPeerPOSIXSharedMemory \
            TestPeerUnixSocketUID \
            TestPeerProcessStopAndAbsence \
            TestPeerSystemVSharedMemory
      # Repository-specific flags/packages and exact peer exclusions below.
      # Verbose output keeps existing runtime skips (including root opt-in) visible.
      - name: Test without privileged qualification
        run: >-
          env -u LINUXOS_ROOT_QUALIFICATION CGO_ENABLED=1 GOMAXPROCS=2
          go test -v -p 1 -count=1 -timeout=20m
          -skip '^(TestPeerTemporaryFileInventory|TestPeerPOSIXSharedMemory|TestPeerUnixSocketUID|TestPeerProcessStopAndAbsence|TestPeerSystemVSharedMemory)$'
          ./...
