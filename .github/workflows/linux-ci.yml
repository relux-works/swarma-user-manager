# Template for public module repositories.
# Repository-specific: runner/bootstrap and loader diagnostics; Go version;
# test flags/packages, qualification variable and peerUID's environment gate.
# Review leaves SWARMA_TEST_UNPRIVILEGED unset. Peer-account paths outside peerUID
# run in CI and fail without the prepared accounts, intentionally.
name: Linux Go CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    # Repository-specific: bootstrap pins python3.14; Ubuntu 24.04 refuses by design.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.10' # Repository-specific toolchain pin.
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      # Repository-specific, read-only diagnostics; unavailable probes are nonfatal.
      - name: Report bootstrap and loader prerequisites
        continue-on-error: true
        run: |
          cat /etc/os-release || printf '%s\n' 'os-release unavailable'
          ldd --version | head -1 || printf '%s\n' 'glibc version unavailable'
          ls -l /usr/bin/python3.14 || printf '%s\n' '/usr/bin/python3.14 absent or unreadable'
          sha256sum /etc/ld.so.cache || printf '%s\n' 'loader cache digest unavailable'
          ldconfig -p | awk '$1 == "libc.so.6" || $1 == "libm.so.6" || $1 == "libnss_systemd.so.2"' || printf '%s\n' 'loader cache rows unavailable'
      # Repository-specific: peerUID skips peer fixtures only for this exact value.
      # Verbose output includes each skip and reason; review leaves it unset.
      - name: Test without privileged qualification
        env:
          SWARMA_TEST_UNPRIVILEGED: '1'
        run: >-
          env -u LINUXOS_ROOT_QUALIFICATION CGO_ENABLED=1 GOMAXPROCS=2
          go test -v -p 1 -count=1 -timeout=20m
          ./...
