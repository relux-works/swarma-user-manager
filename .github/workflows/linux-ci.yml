# Template for public module repositories.
# Copy .github/scripts/privileged-tests with this workflow when reusing the audit.
# Repository-specific: Go version; test flags/packages and qualification variable;
# shared peer-test exclusion expression and the peerRun/sudo source audit below.
name: Linux Go CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      # Repository-specific: shared by the report, source audit and test command.
      PRIVILEGED_TEST_SKIP: '^(TestPeerTemporaryFileInventory|TestPeerPOSIXSharedMemory|TestPeerUnixSocketUID|TestPeerProcessStopAndAbsence|TestPeerSystemVSharedMemory|TestPeerReceiptObservation|TestReviewMqueueOwnedObject)$'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.10' # Repository-specific toolchain pin.
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      # Repository-specific: these seven fixtures need sudo-to-peer accounts.
      # They run during review on a prepared host, not in unprivileged CI.
      # Fail if a new peerRun/direct-sudo test (including named helper callers)
      # is absent from the shared skip list; print each validated exclusion.
      - name: Check and report privileged test exclusions
        run: |
          git grep -n -E 'peerRun[[:space:]]*\(|/usr/bin/sudo' -- '*_test.go'
          go test -count=1 ./.github/scripts/privileged-tests
          go run ./.github/scripts/privileged-tests "$PRIVILEGED_TEST_SKIP"
      # Repository-specific flags/packages and exact peer exclusions below.
      # Verbose output keeps existing runtime skips (including root opt-in) visible.
      - name: Test without privileged qualification
        run: >-
          env -u LINUXOS_ROOT_QUALIFICATION CGO_ENABLED=1 GOMAXPROCS=2
          go test -v -p 1 -count=1 -timeout=20m
          -skip "$PRIVILEGED_TEST_SKIP"
          ./...
